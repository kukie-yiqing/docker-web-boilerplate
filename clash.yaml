port: 7890
socks-port: 7891
mixed-port: 7892
allow-lan: true
mode: rule
log-level: info
external-controller: '127.0.0.1:9090'

tun:
  enable: true
  stack: system
  auto-route: true
  auto-detect-interface: true
  strict-route: false
  exclude-interface:
    - Tailscale
  route-exclude-address:
    - 100.64.0.0/10
    - fd7a:115c:a1e0::/48
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
    - "not:100.100.100.100:53"

dns:
  enable: true
  enhanced-mode: fake-ip
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  fake-ip-filter:
    - "*.tailscale.com"
    - "*.ts.net"
    - "+.qq.com"
    - "+.weixin.qq.com"
    - "+.baidu.com"
    - "+.baidupcs.com"
    - "+.aliyun.com"
    - "+.taobao.com"
    - "+.jd.com"
    - "+.bytedance.com"
    - "+.douyin.com"
    - "+.163.com"

proxies:
  - name: "Railway-Kukie-yiqing"
    type: vless
    server: kukiezhang-docker-web-boilerplate.hf.space
    port: 443
    uuid: B26B70DB81094144A04C0D230BBB856A
    udp: true
    tls: true
    network: ws
    ws-opts:
      path: /tech-stream

proxy-groups:
  - name: "🚀 代理"
    type: select
    proxies:
      - "Railway-Kukie-yiqing"
      - "DIRECT"

